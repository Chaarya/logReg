<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register & Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <Form class="Register" id="RegisterForm">
        <label for="RegisterUser">Enter your username</label>
        <input type="text" id="RegisterUser"> <br>
        <label for="RegPassword">Enter your password</label>
        <input type="password" id="RegPassword">
        <button>Register</button>
    </Form> 
    <br> <br>

    <Form class="Login" id="LoginForm">
        <label for="loginUsername">Enter your username</label>
        <input type="text" id="loginUsername"> <br>
        <label for="loginPass">Enter your password</label>
        <input type="password" id="loginPass">
        <button>Login</button>
    </Form>
    <div id="msg"></div>
    <script src="app.js"></script>
</body>
</html>
